<script>
(function(){
  var W=340, sheets=[document.getElementById('s0'),document.getElementById('s1'),document.getElementById('s2')];
  var book=document.getElementById('book'), hint=document.getElementById('hint'), endcard=document.getElementById('endcard');
  var flipped=0, N=3;
  function zfix(animIdx){
    for(var i=0;i<N;i++){
      var s=sheets[i];
      s.style.zIndex = (i<flipped) ? (i+1) : (N-i+3);
      if(i===animIdx) s.style.zIndex = 20;
    }
  }
  function shift(){
    var t = (flipped===0)? -W/2 : (flipped===N ? W/2 : 0);
    book.style.transform='translateX('+t+'px)';
  }
  function apply(animIdx){
    for(var i=0;i<N;i++) sheets[i].style.transform='rotateY('+(i<flipped?-180:0)+'deg)';
    zfix(animIdx); shift(); fit();
    hint.style.opacity = flipped===0 ? 1 : 0;
    if(!document.body.classList.contains('videomode')){
      if(flipped===N){ setTimeout(function(){ if(flipped===N) endcard.classList.add('show'); }, 950); }
      else { endcard.classList.remove('show'); }
    }
  }
  function next(){ if(flipped<N){ flipped++; apply(flipped-1);} }
  function prev(){ if(flipped>0){ flipped--; apply(flipped);} }
  document.getElementById('again').addEventListener('click', function(e){
    e.stopPropagation(); endcard.classList.remove('show'); flipped=0; apply();
  });
  document.getElementById('navR').addEventListener('click', next);
  document.getElementById('navL').addEventListener('click', prev);
  document.addEventListener('keydown', function(e){ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });
  var tx=null;
  document.addEventListener('touchstart',function(e){ tx=e.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',function(e){ if(tx===null)return; var dx=e.changedTouches[0].clientX-tx; if(dx<-40)next(); if(dx>40)prev(); tx=null; },{passive:true});
  function fit(){
    var pad=70, aw=innerWidth-30, ah=innerHeight-pad;
    var wide = 720;
    if(innerWidth<=700 && !document.body.classList.contains('videomode')){
      /* phone: cover and back show ONE page - let it fill the screen instead of
         reserving room for the empty facing page */
      wide = (flipped===0 || flipped===N) ? 380 : 700;
    }
    var sc=Math.min(aw/wide, ah/850, 1.25);
    document.getElementById('scaler').style.transform='scale('+sc+')';
  }
  addEventListener('resize',fit); fit(); apply();

  /* ---- deterministic pose API for video rendering ---- */
  window.setPose=function(f0,f1,f2,end){
    document.body.classList.add('videomode');
    document.getElementById('scaler').classList.add('no-anim');
    book.classList.add('no-anim'); document.body.classList.add('no-anim');
    var fs=[f0,f1,f2], animIdx=-1;
    flipped = (f0>=1?1:0)+(f1>=1?1:0)+(f2>=1?1:0);
    for(var i=0;i<3;i++){
      sheets[i].style.transform='rotateY('+(-180*Math.min(1,Math.max(0,fs[i])))+'deg)';
      if(fs[i]>0&&fs[i]<1) animIdx=i;
    }
    zfix(animIdx);
    var t = -W/2*(1-Math.min(1,f0)) + W/2*Math.max(0,Math.min(1,f2));
    book.style.transform='translateX('+t+'px)';
    endcard.classList.remove('show');
    endcard.style.opacity = end||0;
    endcard.style.pointerEvents='none';
  };
})();
</script>
