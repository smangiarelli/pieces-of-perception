  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #6C63FF;
      --accent-dark:  #5349e0;
      --accent-bg:    rgba(108,99,255,0.07);
      --warm:         #E8845A;
      --warm-light:   rgba(232,132,90,0.10);
      --sage:         #52B788;
      --sage-light:   rgba(82,183,136,0.10);
      --sky:          #3FA8CC;
      --sky-light:    rgba(63,168,204,0.10);
      --lavender:     #8E7FC4;
      --lavender-light: rgba(142,127,196,0.12);
      --rose:         #D95B72;
      --deep:         #16162A;
      --text:         #2C2C3E;
      --text-light:   #6B6B80;
      --border:       #E6E8F0;
      --border-soft:  rgba(108,99,255,0.12);
      --bg:           #F7F8FC;
      --white:        #ffffff;
      --card-shadow:  0 2px 8px rgba(22,22,42,0.06), 0 8px 32px rgba(22,22,42,0.08);
      --card-shadow-hover: 0 4px 16px rgba(22,22,42,0.10), 0 16px 48px rgba(22,22,42,0.12);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .serif { font-family: 'Playfair Display', Georgia, serif; }

    /* ── NAV ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 48px;
      display: flex; align-items: center; justify-content: space-between;
      height: 68px;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-brand .brand-name { font-size: 17px; font-weight: 700; color: var(--deep); letter-spacing: -0.3px; }
    .nav-right { display: flex; align-items: center; gap: 18px; }
    .nav-link {
      font-size: 13.5px; color: var(--text-light); font-weight: 500;
      text-decoration: none;
    }
    .nav-link:hover { color: var(--accent); }
    .btn-signout {
      padding: 8px 16px;
      font-size: 13.5px; font-weight: 600;
      background: white;
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all .2s;
    }
    .btn-signout:hover {
      border-color: var(--rose);
      color: var(--rose);
    }
    @media (max-width: 600px) {
      .nav { padding: 0 18px; }
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 28px; border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all .22s; border: none;
      font-family: 'DM Sans', sans-serif; letter-spacing: -0.1px;
    }
    .btn-primary {
      background: var(--accent); color: white;
      box-shadow: 0 2px 8px rgba(108,99,255,0.25);
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108,99,255,0.35);
    }
    .btn-large { padding: 15px 36px; font-size: 16px; border-radius: 14px; }
    .btn-warm { background: var(--warm); color: white; box-shadow: 0 2px 8px rgba(232,132,90,0.25); }
    .btn-warm:hover { background: #d4744a; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,132,90,0.35); }
    .btn-outline { background: white; color: var(--accent); border: 1.5px solid rgba(108,99,255,0.3); }
    .btn-outline:hover { border-color: var(--accent); background: var(--accent-bg); }
    .btn-ghost { background: transparent; color: var(--text-light); border: 1.5px solid var(--border); }
    .btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 40px 24px 80px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }
    @media (max-width: 600px) { main { padding: 24px 16px 60px; } }

    /* ── PROGRESS ── */
    .progress-wrap {
      margin-bottom: 32px;
    }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: var(--text-light); font-weight: 500;
      margin-bottom: 10px;
    }
    .progress-meta .step-label { color: var(--accent); font-weight: 600; }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--sky));
      border-radius: 999px;
      transition: width .35s ease;
    }

    /* ── CARD ── */
    .card {
      background: white;
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      padding: 40px 36px;
      position: relative;
    }
    @media (max-width: 600px) { .card { padding: 28px 20px; border-radius: 18px; } }

    .step-eyebrow {
      display: inline-block;
      padding: 5px 14px;
      background: var(--accent-bg); color: var(--accent);
      border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
      margin-bottom: 14px; border: 1px solid var(--border-soft);
    }
    .step-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(24px, 3.6vw, 30px); font-weight: 800;
      color: var(--deep); line-height: 1.2; margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .step-sub {
      font-size: 15px; color: var(--text-light);
      margin-bottom: 28px;
      line-height: 1.7;
    }

    /* ── FORM CONTROLS ── */
    .field { margin-bottom: 22px; }
    .field-label {
      display: block;
      font-size: 14.5px; font-weight: 600;
      color: var(--deep);
      margin-bottom: 8px;
    }
    .field-help {
      font-size: 13px; color: var(--text-light);
      margin-top: -4px; margin-bottom: 8px;
    }
    .req { color: var(--rose); margin-left: 3px; }

    .field-disclaimer {
      margin-top: 12px;
      padding: 12px 14px;
      background: rgba(232,132,90,0.07);
      border-left: 3px solid var(--warm);
      border-radius: 0 10px 10px 0;
      font-size: 12.5px;
      color: var(--text-light);
      line-height: 1.6;
    }
    .field-disclaimer a { color: var(--accent); text-decoration: underline; }

    .input, .textarea, .select {
      width: 100%;
      padding: 13px 16px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .input:focus, .textarea:focus, .select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.12);
    }
    .textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
    .select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath fill='%236B6B80' d='M6 8L0 0h12z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 18px center;
      background-size: 12px 8px;
      padding-right: 44px;
    }

    /* radio/checkbox card group */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .options-grid.cols-1 { grid-template-columns: 1fr; }
    @media (max-width: 520px) { .options-grid { grid-template-columns: 1fr; } }

    .opt {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 13px 15px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .12s;
      background: white;
      font-size: 14.5px;
      color: var(--text);
      line-height: 1.45;
      user-select: none;
    }
    .opt:hover { border-color: var(--accent); background: var(--accent-bg); }
    .opt input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
    .opt.selected { border-color: var(--accent); background: var(--accent-bg); }
    .opt-text { flex: 1; }

    /* flow-choice cards (entry step) */
    .flow-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 8px;
    }
    @media (max-width: 700px) { .flow-grid { grid-template-columns: 1fr; } }

    /* Third flow card — Next Chapter Profile (transition years, 16+) */
    @media (min-width: 701px) and (max-width: 1040px) {
      .flow-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .flow-card.transition { border-color: #3FA8CC; background: linear-gradient(145deg, rgba(63,168,204,0.05), white); }
    .flow-card.transition:hover { border-color: #3FA8CC; }
    .btn-sky { background: #3FA8CC; color: #fff; border: 1px solid #3FA8CC; }
    .btn-sky:hover { background: #3796b8; border-color: #3796b8; }

    .flow-card {
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 26px 24px;
      cursor: pointer;
      transition: all .22s;
      background: white;
      display: flex; flex-direction: column;
    }
    .flow-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--card-shadow); }
    .flow-card.featured { border-color: var(--accent); background: linear-gradient(145deg, rgba(108,99,255,0.04), white); position: relative; }
    .flow-card.featured::after {
      content: 'Most Comprehensive';
      position: absolute;
      top: 14px; right: 14px;
      background: var(--accent); color: white;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .flow-icon { font-size: 30px; margin-bottom: 10px; }
    .flow-card h3 { font-size: 18px; font-weight: 700; color: var(--deep); margin-bottom: 4px; letter-spacing: -0.3px; }
    .flow-tagline { font-size: 13px; color: var(--text-light); margin-bottom: 12px; }
    .flow-price { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 800; color: var(--deep); margin-bottom: 10px; letter-spacing: -1px; }
    .flow-price .currency { font-size: 16px; vertical-align: super; margin-right: 2px; }
    .flow-desc { font-size: 13.5px; color: var(--text); line-height: 1.55; margin-bottom: 16px; flex: 1; }
    .flow-card .btn { width: 100%; }

    /* ── NAV ROW ── */
    .step-actions {
      display: flex; justify-content: space-between; align-items: center;
      gap: 14px; margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .step-actions .right-side { display: flex; gap: 10px; align-items: center; }

    /* ── REVIEW ── */
    .review-section {
      margin-bottom: 24px;
      padding: 18px 18px;
      background: var(--bg);
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .review-section h4 {
      font-size: 13px; font-weight: 700; letter-spacing: 0.4px;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 10px;
    }
    .review-row {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 14px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 14px;
    }
    .review-row:last-child { border-bottom: none; }
    .review-key { color: var(--text-light); font-weight: 500; }
    .review-val { color: var(--text); font-weight: 500; word-wrap: break-word; }
    @media (max-width: 600px) {
      .review-row { grid-template-columns: 1fr; gap: 4px; }
    }

    /* ── IEP ADD-ON ── */
    .addon-card {
      border: 2px solid var(--warm);
      border-radius: 18px;
      padding: 24px;
      background: linear-gradient(145deg, rgba(232,132,90,0.06), white);
      margin-bottom: 22px;
    }
    .addon-flag {
      display: inline-block;
      background: var(--warm); color: white;
      font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
      padding: 4px 10px; border-radius: 20px;
      margin-bottom: 10px;
    }
    .addon-card h3 { font-size: 19px; font-weight: 700; color: var(--deep); margin-bottom: 6px; }
    .addon-price {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 800; color: var(--warm);
      margin-bottom: 12px;
    }
    .addon-features { list-style: none; margin-bottom: 16px; }
    .addon-features li {
      font-size: 13.5px; color: var(--text);
      padding: 5px 0; padding-left: 22px; position: relative;
      line-height: 1.5;
    }
    .addon-features li::before {
      content: '✓'; position: absolute; left: 0; top: 5px;
      color: var(--warm); font-weight: 700;
    }
    .addon-toggle {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-weight: 600; font-size: 14.5px;
      cursor: pointer; user-select: none;
      transition: border-color .15s, background .15s;
    }
    .addon-toggle:hover { border-color: var(--warm); }
    .addon-toggle.selected { border-color: var(--warm); background: var(--warm-light); }
    .addon-toggle input { accent-color: var(--warm); width: 18px; height: 18px; cursor: pointer; }

    /* ── ALERTS ── */
    .alert-error {
      background: rgba(217,91,114,0.08);
      border: 1px solid rgba(217,91,114,0.22);
      color: var(--rose);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-bottom: 18px;
      display: none;
    }
    .alert-error.visible { display: block; }

    /* ── LOADING ── */
    #loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 60vh;
      color: var(--text-light); font-size: 15px;
    }
    #content { display: none; }
    #content.ready { display: block; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* draft-saved nudge */
    .saved-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--sage);
      font-weight: 600;
      opacity: 0;
      transition: opacity .25s;
    }
    .saved-pill.show { opacity: 1; }
    .saved-pill::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--sage);
    }

    /* ── FOOTER ── */
    footer {
      padding: 28px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      border-top: 1px solid var(--border);
      background: white;
    }
    footer a { color: var(--text-light); text-decoration: none; margin: 0 10px; }
    footer a:hover { color: var(--accent); }
  
    /* ── Acknowledgments (mirrors beta-dashboard.html) ── */
    .ack-item {
      display: flex; align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      border: 1.5px solid var(--border, #E6E8F0);
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
    }
    .ack-item:hover { border-color: var(--accent, #6C63FF); background: rgba(108,99,255,0.06); }
    .ack-item:has(input:checked) {
      border-color: var(--accent, #6C63FF);
      background: rgba(108,99,255,0.06);
    }
    .ack-item input[type="checkbox"] {
      margin-top: 3px;
      width: 18px; height: 18px;
      accent-color: var(--accent, #6C63FF);
      flex-shrink: 0;
      cursor: pointer;
    }
    .ack-item-text {
      flex: 1;
      font-size: 15px;
      color: var(--text, #2C2C3E);
      line-height: 1.55;
    }
    .ack-link {
      color: var(--accent, #6C63FF);
      text-decoration: underline;
      font-weight: 500;
      font-size: 14px;
    }
    .ack-link:hover { color: var(--accent-dark, #5349e0); }
    .ack-footnote {
      font-size: 12.5px;
      color: var(--text-light, #6B6B80);
      text-align: center;
      margin-top: 18px;
    }

  </style>
</head>

<script>
  // ─────────────────────────────────────────────────────────────
  // CONFIG
  // ─────────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://ezberjgmwdahiljzproz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_BmIVYs8B9SBH4csFJpeF2A_L-iChMgX';
  const DRAFT_KEY = 'pop_questionnaire_draft';

  // ─────────────────────────────────────────────────────────────
  // SESSION
  // ─────────────────────────────────────────────────────────────
  function getSession() {
    // Phase 2A preview bypass: ?preview=foundation skips auth so the
    // staged file can be opened directly from the file system.
    try {
      const url = new URL(window.location.href);
      if (url.searchParams.get('preview') === 'foundation') {
        return { access_token: 'preview', user_id: 'preview-user', email: 'preview@local', name: 'Preview', expires_at: Date.now() + 3600000 };
      }
    } catch (_) {}
    try {
      const raw = localStorage.getItem('pop_session');
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s.access_token || !s.user_id) return null;
      if (s.expires_at && s.expires_at < Date.now()) return null;
      return s;
    } catch (e) { return null; }
  }
  function clearSession() { try { localStorage.removeItem('pop_session'); } catch (_) {} }
  function redirectToAuth() { window.location.href = '/beta-portal.html'; }

  async function ensureFreshSession() {
    // Returns a valid session, refreshing the access token if it is expired
    // or about to expire — so a long questionnaire never logs the user out
    // mid-flow. Returns null only if there is no usable session at all.
    try {
      const url = new URL(window.location.href);
      if (url.searchParams.get('preview') === 'foundation') return getSession();
    } catch (e) {}
    let s = null;
    try { s = JSON.parse(localStorage.getItem('pop_session') || 'null'); } catch (e) {}
    if (!s || !s.access_token || !s.user_id) return getSession();
    const soon = Date.now() + 120000; // refresh if it expires within 2 minutes
    if (s.expires_at && s.expires_at > soon) return s; // still good
    if (!s.refresh_token) return getSession(); // can't refresh; let caller handle
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (res.ok) {
        const d = await res.json();
        const refreshed = {
          access_token: d.access_token,
          refresh_token: d.refresh_token || s.refresh_token,
          user_id: (d.user && d.user.id) ? d.user.id : s.user_id,
          email: (d.user && d.user.email) ? d.user.email : s.email,
          name: s.name,
          expires_at: Date.now() + ((d.expires_in || 3600) * 1000)
        };
        localStorage.setItem('pop_session', JSON.stringify(refreshed));
        return refreshed;
      }
    } catch (e) {}
    return getSession(); // refresh failed; caller decides (draft stays saved)
  }
  async function signOut() {
    const session = getSession();
    if (session) {
      try {
        await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
        });
      } catch (_) {}
    }
    clearSession();
    window.location.href = '/index.html';
  }

  // CART SUMMARY — surfaces opted-in Care Guides as "added to cart"
  // ─────────────────────────────────────────────────────────────
  function getCartItems() {
    const items = [];
    const flow = state.flow;
    if (!flow) return items;
    const base = flow === 'next_chapter'
      ? { name: 'Next Chapter Profile', price: 149 }
      : flow === 'comprehensive'
      ? { name: 'Comprehensive Plan', price: 149 }
      : { name: 'Action Report',      price: 99 };
    items.push(base);
    function isYes(v) { return typeof v === 'string' && v.indexOf('Yes') === 0; }
    if (isYes(state.data.addon_babysitter))       items.push({ name: 'Babysitter Care Guide',       price: 15 });
    if (isYes(state.data.addon_extended_family))  items.push({ name: 'Extended Family Guide',       price: 15 });
    if (isYes(state.data.addon_sibling))          items.push({ name: 'Sibling Guide',               price: 15 });
    if (isYes(state.data.addon_teacher))          items.push({ name: 'Teacher / School Guide',      price: 15 });
    if (isYes(state.data.addon_service_provider)) items.push({ name: 'Service Provider Guide',      price: 15 });
    // Parenting in Partnership Guide: FREE for every family (2026-08-30) —
    // delivered to everyone by render_family, so it is never a cart item.
    if (state.addon_iep)                          items.push({ name: 'IEP Goal Recommendations',    price: 49 });
    return items;
  }
  function renderCartBadge() {
    let badge = document.getElementById('cart-badge');
    const items = getCartItems();
    if (!state.flow || items.length === 0) {
      if (badge) badge.remove();
      return;
    }
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'cart-badge';
      badge.style.cssText = 'position:fixed;bottom:20px;right:20px;background:white;border:1px solid #E8E4DC;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,0.08);padding:14px 18px;font-family:-apple-system,sans-serif;font-size:13px;z-index:8888;max-width:280px;';
      document.body.appendChild(badge);
    }
    let html = '<div style="font-size:10.5px;font-weight:700;letter-spacing:1px;color:#6C63FF;margin-bottom:8px;">YOUR CART</div>';
    items.forEach(it => {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;color:#2C2A4A;">';
      html += '<span>' + it.name + '</span>';
      html += '<span style="color:#6B6982;font-size:12px;">' + (it.price != null ? ('$' + it.price) : 'add-on') + '</span>';
      html += '</div>';
    });
    // Bundle logic: 4+ individual guides auto-price as the $49 all-6 bundle
    const guideSum = items.filter(it => it.price === 15).reduce((s, it) => s + it.price, 0);
    const otherSum = items.filter(it => it.price !== 15).reduce((s, it) => s + (it.price || 0), 0);
    if (guideSum > 49) {
      html += '<div style="padding:4px 0;color:#52B788;font-size:11.5px;font-weight:600;">&#10003; 4+ guides selected &mdash; all-6 bundle price ($49) applied</div>';
    }
    const total = otherSum + Math.min(guideSum, 49);
    html += '<div style="display:flex;justify-content:space-between;border-top:1px solid #E8E4DC;margin-top:6px;padding-top:6px;font-weight:700;color:#2C2A4A;"><span>Total</span><span>$' + total + '</span></div>';
    badge.innerHTML = html;
  }

  function getQuestionSteps() {
    let steps = [];
    if (state.flow === 'action') {
      steps = SHARED_STEPS
        .concat(ACTION_STEPS)
        .concat(HOUSEHOLD_STEPS)
        .concat(SIBLING_STEPS)
        .concat(ACTION_ADDON_STEPS)
        .concat(FINAL_STEPS);
    } else if (state.flow === 'comprehensive') {
      // FOCUSED_ISSUE_STEPS inserted after the comprehensive child-profile
      // sections (parity fix 2026-06-11 — see FOCUSED_ISSUE_STEPS comment).
      steps = SHARED_STEPS
        .concat(COMPREHENSIVE_STEPS)
        .concat(FOCUSED_ISSUE_STEPS)
        .concat(HOUSEHOLD_STEPS)
        .concat(SIBLING_STEPS)
        .concat(COMPREHENSIVE_ADDON_STEPS)
        .concat(FINAL_STEPS);
    } else if (state.flow === 'next_chapter') {
      // Next Chapter Profile (16+). The full comprehensive core, then
      // the transition block. FOCUSED_ISSUE_STEPS is deliberately left
      // out: this flow is not about one presenting issue.
      steps = SHARED_STEPS
        .concat(COMPREHENSIVE_STEPS)
        .concat(TRANSITION_STEPS)
        .concat(HOUSEHOLD_STEPS)
        .concat(SIBLING_STEPS)
        .concat(COMPREHENSIVE_ADDON_STEPS)
        .concat(FINAL_STEPS);
    } else {
      return [];
    }
    return steps;
  }

  // showIf: a field can declare `showIf: function(state) { return ... }`.
  // Hidden fields are skipped during render AND validation.
  // Parent fields that control showIf should set `triggersRerender: true`
  // so changing them re-renders dependent fields.
  function evalShowIf(f) {
    if (typeof f.showIf !== 'function') return true;
    try { return !!f.showIf(state); } catch (e) { return true; }
  }

  function totalSteps() {
    // After flow is chosen: N question steps + 1 review + 1 add-on
    // (the flow-choice step is shown without a progress bar)
    if (!state.flow) return 1;
    return getQuestionSteps().length + 2;
  }

  // ─────────────────────────────────────────────────────────────
  // RENDER
  // ─────────────────────────────────────────────────────────────
  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === 'className') e.className = attrs[k];
        else if (k === 'html')  e.innerHTML  = attrs[k];
        else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(c => {
        if (c == null) return;
        if (typeof c === 'string') e.appendChild(document.createTextNode(c));
        else e.appendChild(c);
      });
    }
    return e;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function updateProgress() {
    const wrap = document.getElementById('progress-wrap');
    if (!state.flow) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    const tot = totalSteps();
    const cur = state.step + 1; // 1-indexed for display
    document.getElementById('step-counter').textContent = `Step ${cur}`;
    document.getElementById('step-total').textContent   = tot;
    const pct = Math.round((cur / tot) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function render() {
    const card = document.getElementById('step-card');
    card.innerHTML = '';
    updateProgress();
    setTimeout(renderCartBadge, 0);
    // Only jump to the top when the SCREEN changes (new step / section),
    // not when answering a question re-renders the current step in place.
    const _screenKey = [state.acks_confirmed, state.flow, state.intro_shown, state.step].join('|');
    if (render._lastKey !== _screenKey) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render._lastKey = _screenKey;
    }

    if (!state.acks_confirmed) { renderAcknowledgments(card); return; }
    if (!state.flow) { renderFlowChoice(card); return; }
    if (!state.intro_shown) { renderIntro(card); return; }

    const qSteps = getQuestionSteps();

    if (state.step < qSteps.length) {
      renderStep(card, qSteps[state.step]);
    } else if (state.step === qSteps.length) {
      renderReview(card);
    } else if (state.step === qSteps.length + 1) {
      renderAddon(card);
    } else {
      // submission step (handled inline)
    }
  }

  function renderFlowChoice(card) {

    const grid = el('div', { className: 'flow-grid' });

    // Action card
    const actionCard = el('div', { className: 'flow-card', onclick: () => chooseFlow('action') });

    actionCard.appendChild(el('h3', null, 'Action Report'));

    actionCard.appendChild(el('button', { className: 'btn btn-warm', onclick: (e) => { e.stopPropagation(); chooseFlow('action'); } }, 'Choose Action Report →'));
    grid.appendChild(actionCard);

    // Comprehensive card
    const compCard = el('div', { className: 'flow-card featured', onclick: () => chooseFlow('comprehensive') });
    compCard.appendChild(el('div', { className: 'flow-icon' }, '📘'));
    compCard.appendChild(el('h3', null, 'Comprehensive Plan'));
    compCard.appendChild(el('div', { className: 'flow-tagline' }, 'Deep detail. Built to grow with your child.'));
    compCard.appendChild(el('div', { className: 'flow-price', html: '<span class="currency">$</span>149' }));
    compCard.appendChild(el('div', { className: 'flow-desc' }, 'About 18 questions across daily life, school, sensory, social, and family. Best when you want a plan an IEP team or therapist can use.'));
    compCard.appendChild(el('button', { className: 'btn btn-primary', onclick: (e) => { e.stopPropagation(); chooseFlow('comprehensive'); } }, 'Choose Comprehensive Plan →'));
    grid.appendChild(compCard);


    // Next Chapter card (transition years, 16+). Added 2026-08-17.
    const nextCard = el('div', { className: 'flow-card transition', onclick: () => chooseFlow('next_chapter') });
    nextCard.appendChild(el('div', { className: 'flow-icon' }, '🧭'));
    nextCard.appendChild(el('h3', null, 'Next Chapter Profile'));
    nextCard.appendChild(el('div', { className: 'flow-tagline' }, 'For ages 16+. When school ends and adult life begins.'));

  function chooseFlow(flow) {
    // Age advisory for the transition flow. Advisory, never a hard block —
    // a 15-year-old a year from an 18-21 program is a legitimate buyer, and
    // age is collected later in the questionnaire anyway.
    if (flow === 'next_chapter') {
      const a = Number(state.data.child_age);

        const ok = window.confirm(
          'The Next Chapter Profile is written for ages 16 and up — school ' +
          'transition, work, and the decisions that arrive at 18.\n\n' +
          'You entered age ' + a + '. The Comprehensive Plan is usually the ' +
          'better fit below 16.\n\nContinue with Next Chapter anyway?');
        if (!ok) return;
      }
    }
    state.flow = flow;
    state.step = 0;
    state.intro_shown = false; // re-show intro if flow is re-chosen
    saveDraft();
    render();
  }

  // ───────────────────────────────────────────────────────────────
  // POLICY ACKNOWLEDGMENTS (Phase 3.5)
  // Lifted from beta-dashboard.html so the acks gate the questionnaire
  // every time it's started — not just the first dashboard visit.
  // ───────────────────────────────────────────────────────────────
  // LIVE customers accept the Family Service Agreement at CHECKOUT, before
  // payment (attorney requirement, MES redline 2026-08-19). By the time they
  // reach this form the ack is already on record and this screen is skipped.
  // The screen below is the fallback for any account that arrives without an
  // acknowledgment — and it now uses the CUSTOMER agreement, not the beta one.
  const CUSTOMER_AGREEMENT = { type: 'customer_agreement', version: 'v1.1', url: '/customer-agreement.html' };
  const BETA_AGREEMENT     = { type: 'beta_agreement',     version: 'v1.0', url: '/beta-agreement.html' };
  // What a NEW acknowledgment recorded from this screen is recorded as.
  const ACTIVE_AGREEMENT = CUSTOMER_AGREEMENT;

  // B2B provider-coded flow (2026-07-15): when this family claimed a
  // provider-tagged invite code, a 6th consent-to-share checkbox is
  // REQUIRED on the acknowledgment screen. PROVIDER_NAME stays null for
  // every normal family — zero change to the standard flow.
  let PROVIDER_NAME = null;

  // The three acknowledgments the attorney drafted (MES 2026-08-19). These are
  // word-for-word identical to the boxes on checkout.html and family-dashboard.html
  // — do not reword one without the other two.
  const ACK_POINTS = [
    'I have read and agree to the <strong>Family Service Agreement</strong> ' +
      '<a href="' + ACTIVE_AGREEMENT.url + '" target="_blank" rel="noopener" class="ack-link">(view full text)</a>, ' +
      'including the parental consent provisions in the Agreement.',
    'I confirm that I am over the age of 18 and I am the parent, legal guardian, or other person ' +
      'legally authorized to provide information about the Child for whom I am obtaining a Report.',
    'I understand that my questionnaire responses and Reports will remain available through my ' +
      'account for the applicable <strong>12-month Retention Period</strong> described in the Agreement. ' +
      'After the applicable Retention Period ends, this information will be permanently deleted. ' +
      'I am responsible for downloading any Reports I wish to retain before deletion and am encouraged ' +
      'to immediately download and save all Reports.'
  ];

  // Continue unlocks when every REQUIRED box is checked. Boxes carrying
  // data-optional="1" (currently the sponsored-access sharing authorization)
  // are deliberately excluded — an unchecked optional box is a real answer.
  function refreshAckContinue() {
    const btn = document.getElementById('ack-continue-q');
    if (!btn) return;
    const boxes = Array.from(document.querySelectorAll('#ack-list-q input[type="checkbox"]'))
      .filter(b => b.getAttribute('data-optional') !== '1');
    btn.disabled = !(boxes.length && boxes.every(b => b.checked));
  }

  function renderAcknowledgments(card) {
    card.appendChild(el('div', { className: 'step-eyebrow' }, 'BEFORE YOU BEGIN'));
    card.appendChild(el('h2', { className: 'step-title serif' }, 'What you’re agreeing to'));

    const sub = el('p', { className: 'step-sub', html:
      'Everything below is part of one document — the <strong>Family Service Agreement</strong>. ' +
      'Please <a href="' + ACTIVE_AGREEMENT.url + '" target="_blank" rel="noopener" class="ack-link">read the full agreement</a>, ' +
      'then check each box to confirm. Your acknowledgment is recorded with a timestamp.' });
    card.appendChild(sub);

    const errBox = el('div', { className: 'alert-error', id: 'ack-err' });
    card.appendChild(errBox);

    const list = el('div', { id: 'ack-list-q', style: 'margin-top:16px;' });
    ACK_POINTS.forEach(pt => {
      const item = el('label', { className: 'ack-item' });
      const cb = el('input', {
        type: 'checkbox',
        onchange: () => refreshAckContinue()
      });
      item.appendChild(cb);
      item.appendChild(el('span', { className: 'ack-item-text', html: pt }));
      list.appendChild(item);
    });
    card.appendChild(list);

    // Provider-coded flow: ask Supabase whether this user came through a
    // partner code; if so, append the required consent-to-share checkbox.
    // Soft-fails silently — the normal family flow is never affected.
    (async () => {
      try {
        const session = getSession ? getSession() : null;
        if (!session || !session.access_token) return;
        const resp = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_my_provider', {
          method: 'POST',
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + session.access_token,
            'Content-Type':  'application/json'
          },
          body: '{}'
        });
        if (!resp.ok) return;
        const provRows = await resp.json();
        const provName = Array.isArray(provRows) && provRows.length ? provRows[0].provider_name : null;
        if (!provName) return;
        PROVIDER_NAME = provName;
        const item = el('label', { className: 'ack-item' });
        // OPTIONAL by design: sponsored access does not require the family to
        // authorize sharing (Family Service Agreement, Section 1). Checking it
        // is the authorization; leaving it unchecked is a valid answer and must
        // NOT block the Continue button.
        const cb = el('input', {
          type: 'checkbox',
          id: 'ack-provider-share',
          onchange: () => refreshAckContinue()
        });
        cb.setAttribute('data-optional', '1');
        item.appendChild(cb);
        // Wording tracks Section 1 of the Family Service Agreement (sponsored
        // access): the Provider PAYS for access, but the family is the
        // customer, Reports go to the family, and NOTHING reaches the Provider
        // unless the family authorizes it here. No branding claim — the
        // "white label" framing was retired on 2026-08-05.
        item.appendChild(el('span', { className: 'ack-item-text', html:
          '<strong>Sharing with your provider (optional).</strong> My access to Pieces of Perception is sponsored by <strong>' + provName + '</strong>. ' +
          'I understand that their payment does <strong>not</strong> by itself authorize Pieces of Perception to share anything with them, and that ' +
          'my Reports are delivered to me directly either way. By checking this box I authorize Pieces of Perception to also provide my ' +
          'questionnaire responses and Reports to <strong>' + provName + '</strong> for use in their services to my family. ' +
          'I understand ' + provName + ' is an independent business, not employed or endorsed by Pieces of Perception, and that I may withdraw ' +
          'this authorization for future sharing at any time by emailing hello@piecesofperception.com. ' +
          'All other terms of the Family Service Agreement are unchanged. ' +
          '<em>If you do not want your answers or Reports shared, leave this box unchecked and use the Continue button below.</em>' }));
        list.appendChild(item);
        refreshAckContinue();
      } catch (e) { /* soft-fail: normal flow unaffected */ }
    })();

    card.appendChild(el('p', {
      className: 'ack-footnote'
    }, 'By checking these boxes you confirm you have read and agree to the full Family Service Agreement. You can revisit it any time at piecesofperception.com/customer-agreement.html.'));

    const actions = el('div', { style: 'margin-top:24px;display:flex;justify-content:flex-end;gap:12px;' });
    const continueBtn = el('button', {
      id: 'ack-continue-q',
      className: 'btn btn-primary',
      disabled: true,
      onclick: () => submitAcksThenContinue()
    }, 'Continue →');
    actions.appendChild(continueBtn);
    card.appendChild(actions);
  }

  async function submitAcksThenContinue() {
    const btn = document.getElementById('ack-continue-q');
    const errEl = document.getElementById('ack-err');
    errEl.style.display = 'none';
    if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

    // Record a single acknowledgment of the unified Family Service Agreement.
    const session = getSession ? getSession() : null;
    if (session && session.user_id) {
      const rows = [{
        user_id:        session.user_id,
        policy_type:    ACTIVE_AGREEMENT.type,
        policy_version: ACTIVE_AGREEMENT.version
      }];
      // Provider flow: record the consent-to-share as its own acknowledgment
      // row AND inside the answers payload (travels into answers.json, so the
      // consent is visible in the pipeline and the report Q&A appendix).
      if (PROVIDER_NAME) {
        // Record the family's ACTUAL answer — yes or no. Sponsored access does
        // not imply authorization to share (Family Service Agreement, Sec. 1).
        const shareBox = document.getElementById('ack-provider-share');
        const authorized = !!(shareBox && shareBox.checked);
        rows.push({
          user_id:        session.user_id,
          policy_type:    'provider_share_consent',
          policy_version: (authorized ? 'v1.0 AUTHORIZED — ' : 'v1.0 DECLINED — ') + PROVIDER_NAME
        });
        state.data = state.data || {};
        state.data.ack_provider_share = authorized
          ? 'Yes — I authorize sharing my answers and reports with ' + PROVIDER_NAME + '.'
          : 'No — I do not authorize sharing my answers or reports with ' + PROVIDER_NAME + '.';
      }
      try {
        await fetch(SUPABASE_URL + '/rest/v1/policy_acknowledgments', {
          method: 'POST',
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + session.access_token,
            'Content-Type':  'application/json',
            'Prefer':        'resolution=ignore-duplicates'
          },
          body: JSON.stringify(rows)
        });
      } catch (e) {
        // Soft-fail — they can still proceed; their ack is on the dashboard.
        console.warn('Ack save error (non-blocking):', e);
      }
    }

    state.acks_confirmed = true;
    // CRITICAL: force-reset intro so it shows EVERY time a parent restarts
    // the questionnaire (not just the first time).
    state.intro_shown = false;
    saveDraft();
    render();
  }

  function renderStep(card, step) {
    card.appendChild(el('div', { className: 'step-eyebrow' }, step.eyebrow.toUpperCase()));
    card.appendChild(el('h2', { className: 'step-title serif' }, step.title));
    if (step.sub) card.appendChild(el('p', { className: 'step-sub' }, step.sub));

    const errorBox = el('div', { className: 'alert-error', id: 'step-error' });
    card.appendChild(errorBox);

    step.fields.forEach(f => {
      if (!evalShowIf(f)) return;            // skip hidden conditional fields
      card.appendChild(renderField(f));
    });

    card.appendChild(renderStepActions({ showBack: true, nextLabel: 'Continue →' }));
  }

  function renderField(f) {
    const wrap = el('div', { className: 'field' });

    const labelEl = el('label', { className: 'field-label', for: 'fld_' + f.key },
      f.label + (f.required ? '' : ' (optional)'));
    if (f.required) {
      labelEl.appendChild(el('span', { className: 'req' }, '*'));
    }
    wrap.appendChild(labelEl);
    if (f.help) wrap.appendChild(el('div', { className: 'field-help' }, f.help));

    const cur = state.data[f.key];

    if (f.type === 'text' || f.type === 'number') {
      const input = el('input', {
        type: f.type, className: 'input', id: 'fld_' + f.key,
        placeholder: f.placeholder || '',
        value: cur == null ? '' : cur
      });
      if (f.min != null) input.setAttribute('min', f.min);
      if (f.max != null) input.setAttribute('max', f.max);
      input.addEventListener('input', () => { state.data[f.key] = input.value; saveDraft(); });
      wrap.appendChild(input);
    }
    else if (f.type === 'textarea') {
      const ta = el('textarea', {
        className: 'textarea', id: 'fld_' + f.key,
        placeholder: f.placeholder || '',
        rows: 5
      });
      ta.value = cur == null ? '' : cur;
      ta.addEventListener('input', () => { state.data[f.key] = ta.value; saveDraft(); });
      wrap.appendChild(ta);
    }
    else if (f.type === 'select') {
      const sel = el('select', { className: 'select', id: 'fld_' + f.key });
      sel.appendChild(el('option', { value: '' }, '— Select —'));
      f.options.forEach(opt => {
        const o = el('option', { value: opt }, opt);
        if (cur === opt) o.setAttribute('selected', 'selected');
        sel.appendChild(o);
      });
      sel.addEventListener('change', () => {
        state.data[f.key] = sel.value;
        saveDraft();
        if (f.triggersRerender) render();
      });
      wrap.appendChild(sel);
    }
    else if (f.type === 'multi_with_text') {
      // Click-first multi-select + optional "anything else?" follow-up.
      // Stored as a single semicolon-separated string so the backend schema
      // (textarea-equivalent) doesn't need to change.
      const PARENT_KEY = f.key;
      const stored = state.data[PARENT_KEY] || '';
      let preselected = new Set();
      let extra = '';
      if (stored) {
        const parts = stored.split('; ').map(s => s.trim()).filter(Boolean);
        const optSet = new Set(f.options);
        for (const part of parts) {
          if (optSet.has(part)) preselected.add(part);
          else extra = extra ? (extra + '; ' + part) : part;
        }
      }

      function rebuildStored() {
        const checks = Array.from(wrap.querySelectorAll('input[type="checkbox"][data-mc-opt]:checked'))
          .map(b => b.getAttribute('data-mc-opt'));
        const extraVal = (wrap.querySelector('textarea[data-mc-extra]') || {value: ''}).value.trim();
        const allParts = checks.slice();
        if (extraVal) allParts.push(extraVal);
        state.data[PARENT_KEY] = allParts.join('; ');
        saveDraft();
      }

      const grid = el('div', { className: 'options-grid cols-1' });
      f.options.forEach(opt => {
        const item = el('label', { className: 'option-item' });
        const cb = el('input', { type: 'checkbox' });
        cb.setAttribute('data-mc-opt', opt);
        if (preselected.has(opt)) cb.checked = true;
        cb.addEventListener('change', rebuildStored);
        item.appendChild(cb);
        item.appendChild(el('span', { className: 'option-label' }, opt));
        grid.appendChild(item);
      });
      wrap.appendChild(grid);

      const extraWrap = el('div', { style: 'margin-top:14px;' });
      extraWrap.appendChild(el('label', {
        style: 'display:block;font-size:13px;color:var(--text-light);font-weight:500;margin-bottom:6px;'
      }, f.extraLabel || 'Anything else not on the list above? (optional)'));
      const ta = el('textarea', {
        className: 'textarea',
        placeholder: f.extraPlaceholder || 'Add any details specific to your child...',
        rows: 3
      });
      ta.setAttribute('data-mc-extra', '1');
      ta.value = extra;
      ta.addEventListener('input', rebuildStored);
      extraWrap.appendChild(ta);
      wrap.appendChild(extraWrap);
    }
        else if (f.type === 'radio') {
      const grid = el('div', { className: 'options-grid' + (f.options.length <= 4 ? '' : ' cols-1') });
      f.options.forEach(opt => {
        const isSel = cur === opt;
        const optEl = el('label', { className: 'opt' + (isSel ? ' selected' : '') });
        const radio = el('input', { type: 'radio', name: f.key, value: opt });
        if (isSel) radio.setAttribute('checked', 'checked');
        radio.addEventListener('change', () => {
          state.data[f.key] = opt;
          // refresh selected styling
          grid.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
          optEl.classList.add('selected');
          saveDraft();
          if (f.triggersRerender) render();
        });
        optEl.appendChild(radio);
        optEl.appendChild(el('span', { className: 'opt-text' }, opt));
        grid.appendChild(optEl);
      });
      wrap.appendChild(grid);
    }
    else if (f.type === 'checkbox') {
      const grid = el('div', { className: 'options-grid' });
      const arr = Array.isArray(cur) ? cur.slice() : [];
      f.options.forEach(opt => {
        const isSel = arr.indexOf(opt) > -1;
        const optEl = el('label', { className: 'opt' + (isSel ? ' selected' : '') });
        const cb = el('input', { type: 'checkbox', name: f.key, value: opt });
        if (isSel) cb.setAttribute('checked', 'checked');
        cb.addEventListener('change', () => {
          let current = Array.isArray(state.data[f.key]) ? state.data[f.key].slice() : [];
          if (cb.checked) {
            if (current.indexOf(opt) === -1) current.push(opt);
          } else {
            current = current.filter(x => x !== opt);
          }
          state.data[f.key] = current;
          if (cb.checked) optEl.classList.add('selected');
          else optEl.classList.remove('selected');
          saveDraft();
          if (f.triggersRerender) render();
        });
        optEl.appendChild(cb);
        optEl.appendChild(el('span', { className: 'opt-text' }, opt));
        grid.appendChild(optEl);
      });
      wrap.appendChild(grid);
    }

    if (f.disclaimer) wrap.appendChild(el('div', { className: 'field-disclaimer', html: f.disclaimer }));

    return wrap;
  }

  function renderStepActions(opts) {
    const row = el('div', { className: 'step-actions' });
    if (opts.showBack) {
      row.appendChild(el('button', {
        className: 'btn btn-ghost',
        onclick: goBack
      }, '← Back'));
    } else {
      row.appendChild(el('span'));
    }
    const right = el('div', { className: 'right-side' });
    if (opts.extra) right.appendChild(opts.extra);
    right.appendChild(el('button', {
      className: opts.nextClass || 'btn btn-primary',
      onclick: opts.onNext || goNext
    }, opts.nextLabel || 'Continue →'));
    row.appendChild(right);
    return row;
  }

  function validateCurrentStep() {
    const qSteps = getQuestionSteps();
    if (state.step >= qSteps.length) return { ok: true };
    const step = qSteps[state.step];
    for (const f of step.fields) {
      if (!f.required) continue;
      if (!evalShowIf(f)) continue;          // skip required check on hidden fields
      const v = state.data[f.key];
      if (f.type === 'checkbox') {
        if (!Array.isArray(v) || v.length === 0) {
          return { ok: false, msg: `Please answer: ${f.label}` };
        }
      } else if (f.type === 'number') {
        if (v == null || v === '' || isNaN(Number(v))) {
          return { ok: false, msg: `Please enter a number for: ${f.label}` };
        }
        if (f.min != null && Number(v) < f.min) return { ok: false, msg: `${f.label} must be at least ${f.min}.` };
        if (f.max != null && Number(v) > f.max) return { ok: false, msg: `${f.label} can\'t be more than ${f.max}.` };
      } else {
        if (v == null || String(v).trim() === '') {
          return { ok: false, msg: `Please answer: ${f.label}` };
        }
      }
    }
    return { ok: true };
  }

  function showError(msg) {
    const box = document.getElementById('step-error');
    if (!box) { alert(msg); return; }
    box.textContent = msg;
    box.classList.add('visible');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function goNext() {
    const v = validateCurrentStep();
    if (!v.ok) { showError(v.msg); return; }
    state.step += 1;
    saveDraft();
    render();
  }
  function goBack() {
    if (state.step > 0) {
      state.step -= 1;
    } else {
      // back from step 0 → flow-choice
      state.flow = null;
    }
    saveDraft();
    render();
  }

  // ─────────────────────────────────────────────────────────────
  // REVIEW STEP
  // ─────────────────────────────────────────────────────────────
  function renderReview(card) {
    card.appendChild(el('div', { className: 'step-eyebrow' }, 'REVIEW'));
    card.appendChild(el('h2', { className: 'step-title serif' }, 'Take a quick look.'));
    card.appendChild(el('p', { className: 'step-sub' }, 'Make sure everything reflects your child. You can edit any answer before we generate your report.'));

    // Group steps into review sections
    const qSteps = getQuestionSteps();
    qSteps.forEach((step, idx) => {
      const sec = el('div', { className: 'review-section' });
      const head = el('div', { style: 'display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;' });
      head.appendChild(el('h4', null, step.eyebrow));
      const editBtn = el('button', {
        className: 'btn btn-ghost', style: 'padding:6px 14px; font-size:12.5px;',
        onclick: () => { state.step = idx; saveDraft(); render(); }
      }, 'Edit');
      head.appendChild(editBtn);
      sec.appendChild(head);

      step.fields.forEach(f => {
        const v = state.data[f.key];
        const display = formatAnswer(v, f);
        const row = el('div', { className: 'review-row' });
        row.appendChild(el('div', { className: 'review-key' }, f.label));
        row.appendChild(el('div', { className: 'review-val' }, display || '—'));
        sec.appendChild(row);
      });

      card.appendChild(sec);
    });

    card.appendChild(renderStepActions({
      showBack: true,
      nextLabel: 'Looks good, continue →',
      nextClass: 'btn btn-primary'
    }));
  }

  function formatAnswer(v, f) {
    if (v == null) return '';
    if (Array.isArray(v)) return v.join(', ');
    return String(v);
  }

  // ─────────────────────────────────────────────────────────────
  // ADD-ON STEP
  // ─────────────────────────────────────────────────────────────
  function renderAddon(card) {
    card.appendChild(el('div', { className: 'step-eyebrow' }, 'ONE LAST OPTION'));
    card.appendChild(el('h2', { className: 'step-title serif' }, 'Add IEP Goal Recommendations?'));
    card.appendChild(el('p', { className: 'step-sub' }, 'Optional — built specifically to drop into an IEP draft your team can refine. Most families add this when they\'re heading into an annual review or evaluation.'));

    const addon = el('div', { className: 'addon-card' });
    addon.appendChild(el('div', { className: 'addon-flag' }, 'POPULAR ADD-ON'));
    addon.appendChild(el('h3', null, 'IEP Goal Recommendations'));
    addon.appendChild(el('div', { className: 'addon-price', html: '<span style="font-size:14px;vertical-align:super;">$</span>99' }));
    const ul = el('ul', { className: 'addon-features' });
    [
      'Measurable, IEP-ready goal language',
      'Aligned to your child\'s strengths and challenges',
      'Suggested accommodations and supports',
      'Progress monitoring ideas your team can adopt'
    ].forEach(t => ul.appendChild(el('li', null, t)));
    addon.appendChild(ul);

    const isSel = !!state.addon_iep;
    const toggle = el('label', { className: 'addon-toggle' + (isSel ? ' selected' : '') });
    const cb = el('input', { type: 'checkbox' });
    if (isSel) cb.setAttribute('checked', 'checked');
    cb.addEventListener('change', () => {
      state.addon_iep = cb.checked;
      if (cb.checked) toggle.classList.add('selected'); else toggle.classList.remove('selected');
      saveDraft();
      // update the submit label below
      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) submitBtn.textContent = submitLabel();
    });
    toggle.appendChild(cb);
    toggle.appendChild(el('span', null, 'Yes — add IEP Goal Recommendations (+$49)'));
    addon.appendChild(toggle);

    card.appendChild(addon);

    // skip notice
    card.appendChild(el('p', { className: 'step-sub', style: 'font-size:13.5px; margin-top:-6px;' },
      'No pressure — you can always add this later from your dashboard.'));

    // Submit
    const submitBtn = el('button', {
      className: 'btn btn-primary btn-large',
      id: 'submit-btn',
      onclick: submitAndGenerate
    }, submitLabel());

    const row = el('div', { className: 'step-actions' });
    row.appendChild(el('button', { className: 'btn btn-ghost', onclick: goBack }, '← Back'));
    const right = el('div', { className: 'right-side' });
    right.appendChild(submitBtn);
    row.appendChild(right);
    card.appendChild(row);
  }

  function submitLabel() {
    const base = (state.flow === 'comprehensive'
                  || state.flow === 'next_chapter') ? 149 : 99;
    const yes = v => typeof v === 'string' && v.indexOf('Yes') === 0;
    const guideKeys = ['addon_babysitter','addon_extended_family','addon_sibling','addon_teacher','addon_service_provider'];
    const guideCount = guideKeys.filter(k => yes(state.data[k])).length;
    // 4+ guides auto-price as the $49 all-5 bundle
    const total = base + Math.min(guideCount * 15, 49) + (state.addon_iep ? 49 : 0);
    return `Submit & Generate Report ($${total})`;
  }

  // ─────────────────────────────────────────────────────────────
  // SUBMISSION
  // ─────────────────────────────────────────────────────────────
  async function submitAndGenerate() {
    const session = await ensureFreshSession();
    if (!session) { redirectToAuth(); return; }

    const btn = document.getElementById('submit-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving your answers...'; }

    // Map the radio's "Yes — generate the X" string to a boolean for the
    // new add-on columns added in the Phase 2D Supabase migration.
    function isYes(v) { return typeof v === 'string' && v.indexOf('Yes') === 0; }

    const payload = {
      user_id: session.user_id,
      flow: state.flow,

      // Add-on opt-ins (booleans) — populate the new Phase 2D columns
      addon_iep: !!state.addon_iep || (typeof state.data.iep_addon_choice === 'string' && state.data.iep_addon_choice.indexOf('Yes') === 0),
      addon_babysitter:        isYes(state.data.addon_babysitter),
      addon_sibling:           isYes(state.data.addon_sibling),
      addon_extended_family:   isYes(state.data.addon_extended_family),
      addon_teacher:           isYes(state.data.addon_teacher),
      addon_service_provider:  isYes(state.data.addon_service_provider),

      // Promoted shared columns
      child_first_name: state.data.child_first_name || null,
      child_age: state.data.child_age != null && state.data.child_age !== '' ? Number(state.data.child_age) : null,
      grade_level: state.data.grade_level || null,
      diagnoses: state.data.diagnoses || [],
      filler_role: state.data.filler_role || null,
      biggest_challenge: state.data.biggest_challenge || null,
      communication_style: state.data.communication_style || state.data.communication_style_freetext || null,
      meltdown_frequency: state.data.meltdown_frequency || null,
      sensory_sensitivities: state.data.sensory_sensitivities || [],
      school_setting: state.data.school_setting || null,

      // Sibling tier (picks the right age-tiered Sibling Guide template)
      sibling_tier: state.data.sibling_guide_for_age_tier || null,

      // Structured HOUSEHOLD jsonb (multi-home aware)
      household: {
        num_homes:                  state.data.household_num_homes               || null,
        primary_people:             state.data.household_primary_people          || null,
        second_people:              state.data.household_second_people           || null,
        three_or_more_desc:         state.data.household_three_or_more_desc      || null,
        coparenting_style:          state.data.household_coparenting_style       || null,
        transition_cadence:         state.data.household_transition_cadence      || null,
        other_cadence_desc:         state.data.household_other_cadence_desc      || null,
        transition_difficulty:      state.data.household_transition_difficulty   || null,
        transition_day_appearance:  state.data.household_transition_day_appearance || null,
        transition_supports:        state.data.household_transition_supports     || null,
        differences_between_homes:  state.data.household_differences_between_homes || null,
        other_adults:               state.data.household_other_adults            || null,
        legal_considerations:       state.data.household_legal_considerations    || null,
        sensitive_notes:            state.data.household_sensitive_notes         || null,
      },

      // Structured SIBLINGS jsonb
      siblings: {
        has_siblings:                state.data.has_siblings                  || null,
        list:                        state.data.siblings_list                 || null,
        affected_on_hard_days:       state.data.siblings_affected_on_hard_days || null,
        safe_adults:                 state.data.sibling_safe_adults           || null,
        guide_for_name:              state.data.sibling_guide_for_name        || null,
        guide_for_age:               state.data.sibling_guide_for_age != null && state.data.sibling_guide_for_age !== '' ? Number(state.data.sibling_guide_for_age) : null,
        guide_for_age_tier:          state.data.sibling_guide_for_age_tier    || null,
        close_cousin_details:        state.data.addon_sibling_close_cousin_details || null,
      },

      // Catch-all JSON blob — every field the user answered, forward-compatible.
      // The promoted columns above are duplicated here on purpose so any field
      // not yet promoted is still queryable.
      answers: state.data,
      status: 'submitted'
    };

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/questionnaire_responses`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${session.access_token}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Save failed (${res.status}): ${text}`);
      }

      const rows = await res.json();
      const responseId = Array.isArray(rows) && rows.length ? rows[0].id : null;

      // Stash a small handoff for the loading page
      try {
        sessionStorage.setItem('pop_last_submission', JSON.stringify({
          response_id: responseId,
          flow: state.flow,
          addon_iep: state.addon_iep,
          child_first_name: state.data.child_first_name || ''
        }));
      } catch (_) {}

      clearDraft();
      window.location.href = '/generating.html' + (responseId ? ('?id=' + encodeURIComponent(responseId)) : '');
    } catch (err) {
      console.error(err);
      if (btn) { btn.disabled = false; btn.textContent = submitLabel(); }
      showError('We couldn\'t save your answers just now. Please try again — your draft is still saved on this device.');
    }
  }

  // ─────────────────────────────────────────────────────────────
  // BOOT
  // ─────────────────────────────────────────────────────────────
  async function checkSubmissionCap(session) {
    // Returns { count, exempt }. Fails OPEN (count 0) on any error — the
    // database trigger is the authoritative hard cap; this is just UX.
    let count = 0, exempt = false;
    try {
      const r = await fetch(
        `${SUPABASE_URL}/rest/v1/questionnaire_responses?user_id=eq.` +
        encodeURIComponent(session.user_id) + `&select=id`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` } });
      if (r.ok) { const rows = await r.json(); if (Array.isArray(rows)) count = rows.length; }
    } catch (e) { /* fail open */ }
    try {
      const pr = await fetch(
        `${SUPABASE_URL}/rest/v1/profiles?user_id=eq.` +
        encodeURIComponent(session.user_id) + `&select=submission_cap_exempt`,
        { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}` } });
      if (pr.ok) { const rows = await pr.json(); if (rows && rows[0] && rows[0].submission_cap_exempt === true) exempt = true; }
    } catch (e) { /* fail open */ }
    return { count: count, exempt: exempt };
  }

  function renderCapReached() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').classList.add('ready');
    const card = document.getElementById('step-card');
    if (!card) return;
    card.innerHTML =
      '<div class="step-eyebrow">ALL SET</div>' +
      '<h2 class="step-title serif">You\u2019ve used your questionnaire updates</h2>' +
      '<p class="step-sub">Each family gets an initial questionnaire plus one update. Our records show you\u2019ve completed both, so the form is now closed for your account.</p>' +
      '<p class="step-sub">Your finished reports are always available on your dashboard. If you think this is a mistake, or you need another update, just reply to any Pieces of Perception email and we\u2019ll help.</p>' +
      '<div style="margin-top:24px;"><a href="/beta-dashboard.html" style="display:inline-block;padding:13px 26px;background:#6C63FF;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;">Go to My Dashboard</a></div>';
  }

  function showUpdateBanner() {
    try {
      const content = document.getElementById('content');
      if (!content || document.getElementById('update-banner')) return;
      const b = document.createElement('div');
      b.id = 'update-banner';
      b.style.cssText = 'background:#EEEDFE;color:#5349e0;border:1px solid #CECBF6;border-radius:10px;padding:10px 14px;margin:0 0 16px 0;font-size:14px;font-weight:500;text-align:center;';
      b.textContent = 'This is your one-time questionnaire update \u2014 your answers here will refresh your reports.';
      content.insertBefore(b, content.firstChild);
    } catch (e) { /* non-critical */ }
  }

  async function init() {
    const session = await ensureFreshSession();
    if (!session) { redirectToAuth(); return; }

    // Submission cap: initial + one update = 2 max per family.
    // Exempt accounts (founder/test) bypass. Fails open; DB trigger is the
    // authoritative cap.
    const cap = await checkSubmissionCap(session);
    if (!cap.exempt && cap.count >= 2) { renderCapReached(); return; }
    window.__popCap = cap;

    loadDraft();

    // Unified agreement: skip the acknowledgment screen when this account has
    // already accepted it (e.g. on the dashboard). The screen still appears
    // for anyone who reaches the form without an acknowledgment on record,
    // so the legal gate is never bypassed. Fails closed (screen shows) if
    // the check errors.
    if (!state.acks_confirmed) {
      try {
        // Accept EITHER agreement on record: customer_agreement v1.1 (live
        // customers, accepted at checkout before payment) OR beta_agreement
        // v1.0 (beta families completing their original questionnaire). Beta
        // families are separately required to accept the current Family
        // Service Agreement before a free UPDATE — that gate lives on
        // beta-dashboard.html and update.html, not here.
        const ar = await fetch(
          `${SUPABASE_URL}/rest/v1/policy_acknowledgments?user_id=eq.` +
          encodeURIComponent(session.user_id) +
          // Per-type versions. The live Agreement is v1.1; the beta agreement
          // stays v1.0. A single &policy_version filter across both types would
          // lock every beta family out of their own questionnaire, so each type
          // carries its own version here.
          `&or=(and(policy_type.eq.${CUSTOMER_AGREEMENT.type},policy_version.eq.${CUSTOMER_AGREEMENT.version}),` +
              `and(policy_type.eq.${BETA_AGREEMENT.type},policy_version.eq.${BETA_AGREEMENT.version}))` +
          `&select=policy_type&limit=1`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${session.access_token}`, 'Accept': 'application/json' } });
        if (ar.ok) {
          const rows = await ar.json();
          if (Array.isArray(rows) && rows.length) {
            state.acks_confirmed = true;
            saveDraft();
          }
        }
      } catch (e) { /* leave the screen in place */ }
    }

    // Pre-fill flow from URL ?flow=action|comprehensive
    // Phase 2A preview: ?preview=foundation pins a banner to the top so
    // it's obvious you're not on the live form.
    try {
      const url = new URL(window.location.href);
      const f = url.searchParams.get('flow');
      if ((f === 'action' || f === 'comprehensive' || f === 'next_chapter') && !state.flow) {
        state.flow = f;
        state.step = 0;
        saveDraft();
      }
      const p = url.searchParams.get('preview');
      if (p === 'foundation') {
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#FFB100;color:#000;font-family:sans-serif;font-size:12.5px;font-weight:700;text-align:center;padding:6px 10px;z-index:9999;letter-spacing:0.4px;';
        banner.textContent = 'PREVIEW MODE — Phase 2A staging copy. Submission disabled. Not in production.';
        document.body.appendChild(banner);
        document.body.style.paddingTop = '32px';
      }
    } catch (_) {}

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').classList.add('ready');
    if (window.__popCap && !window.__popCap.exempt && window.__popCap.count === 1) showUpdateBanner();
    render();
  }

  init();
</script>
